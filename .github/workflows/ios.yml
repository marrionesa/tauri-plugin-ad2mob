name: iOS Simulator

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "src/**"
      - "guest-js/**"
      - "examples/admob-demo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/ios.yml"

jobs:
  ios:
    name: iOS · simulator build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust iOS targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build example app for iOS simulator
        working-directory: examples/admob-demo/src-tauri
        run: |
          cargo tauri ios init
          cargo tauri ios build --target aarch64-sim
