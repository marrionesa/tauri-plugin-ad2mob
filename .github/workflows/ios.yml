name: iOS Simulator

on:
  # TODO(iOS): push trigger disabled while the iOS simulator build is paused
  # (the job below is kept intact for contributors and manual runs).
  # Re-enable by restoring the commented `push.paths` block.
  # push:
  #   paths:
  #     - "ios/**"
  #     - "src/**"
  #     - "guest-js/**"
  #     - "examples/admob-demo/**"
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - "build.rs"
  #     - ".github/workflows/ios.yml"
  workflow_dispatch:

env:
  # Cargo must use the system ssh (git CLI) so the per-repo SSH aliases
  # configured by setup-cargo-forks apply to the private fork dependencies.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  ios:
    name: iOS · simulator build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Setup private cargo dependency forks
        uses: ./.github/actions/setup-cargo-forks
        with:
          ssh_deploy_key_swift_rs: ${{ secrets.SSH_DEPLOY_KEY_SWIFT_RS }}
          ssh_deploy_key_tauri_utils: ${{ secrets.SSH_DEPLOY_KEY_TAURI_UTILS }}
          ssh_deploy_key_tauri_plugin: ${{ secrets.SSH_DEPLOY_KEY_TAURI_PLUGIN }}

      - name: Install Rust iOS targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build example app for iOS simulator
        working-directory: examples/admob-demo/src-tauri
        run: |
          cargo tauri ios init
          cargo tauri ios build --target aarch64-sim
