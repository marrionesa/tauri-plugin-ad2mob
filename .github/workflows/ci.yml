name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust core + full verification pipeline (formatting, lints, tests, contract
  # parity, publish metadata and the real `cargo publish --dry-run` gate).
  # ---------------------------------------------------------------------------
  rust:
    name: Rust · verify.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |

            .
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Install website dependencies
        working-directory: ad2mob-website
        run: bun install --frozen-lockfile

      - name: Install system libraries (Tauri Linux prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Verify everything (verify.sh)
        run: bash scripts/verify.sh

  # ---------------------------------------------------------------------------
  # TypeScript guest bindings: build, typecheck, tests.
  # ---------------------------------------------------------------------------
  typescript:
    name: TypeScript · build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (CJS + ESM)
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Tests (vitest)
        run: bun run test

      - name: Cross-language contract verification
        run: node scripts/check-contract.mjs

  # ---------------------------------------------------------------------------
  # Android: compile the Kotlin plugin + the example app through the real
  # Tauri toolchain, then run the JVM unit tests.
  # ---------------------------------------------------------------------------
  android:
    name: Android · build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build example app for Android (compiles the plugin Kotlin)
        working-directory: examples/admob-demo/src-tauri
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo tauri android init
          cd ../../..
          node scripts/prepare-demo-android.mjs
          cd examples/admob-demo/src-tauri
          cargo tauri android build --debug --target aarch64

      - name: Run plugin JVM unit tests
        working-directory: examples/admob-demo/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-ad2mob:testDebugUnitTest

  # ---------------------------------------------------------------------------
  # iOS: compile the Swift plugin + the example app for the simulator
  # (unsigned, no signing certificates required).
  # ---------------------------------------------------------------------------
  ios:
    name: iOS · simulator build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build example app for the iOS simulator (compiles the plugin Swift)
        working-directory: examples/admob-demo/src-tauri
        run: |
          cargo tauri ios init
          cargo tauri ios build --target aarch64-apple-ios-sim
