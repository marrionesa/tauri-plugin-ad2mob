name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cargo must use the system ssh (git CLI) so the per-repo SSH aliases
  # configured by setup-cargo-forks apply to the private fork dependencies.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Rust core + full verification pipeline
  # ---------------------------------------------------------------------------
  rust:
    name: Rust · verify.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup private cargo dependency forks
        uses: ./.github/actions/setup-cargo-forks
        with:
          ssh_deploy_key_swift_rs: ${{ secrets.SSH_DEPLOY_KEY_SWIFT_RS }}
          ssh_deploy_key_tauri_utils: ${{ secrets.SSH_DEPLOY_KEY_TAURI_UTILS }}
          ssh_deploy_key_tauri_plugin: ${{ secrets.SSH_DEPLOY_KEY_TAURI_PLUGIN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Install website dependencies
        working-directory: ad2mob-website
        run: bun install --frozen-lockfile

      - name: Install system libraries (Tauri Linux prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Verify everything (verify.sh)
        run: bash scripts/verify.sh

  # ---------------------------------------------------------------------------
  # TypeScript guest bindings
  # ---------------------------------------------------------------------------
  typescript:
    name: TypeScript · build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (CJS + ESM)
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Tests (vitest)
        run: bun run test

      - name: Cross-language contract verification
        run: node scripts/check-contract.mjs

  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------
  android:
    name: Android · build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup private cargo dependency forks
        uses: ./.github/actions/setup-cargo-forks
        with:
          ssh_deploy_key_swift_rs: ${{ secrets.SSH_DEPLOY_KEY_SWIFT_RS }}
          ssh_deploy_key_tauri_utils: ${{ secrets.SSH_DEPLOY_KEY_TAURI_UTILS }}
          ssh_deploy_key_tauri_plugin: ${{ secrets.SSH_DEPLOY_KEY_TAURI_PLUGIN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build example app for Android (compiles the plugin Kotlin)
        working-directory: examples/admob-demo/src-tauri
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo tauri android init
          cd ../../..
          node scripts/prepare-demo-android.mjs
          cd examples/admob-demo/src-tauri
          cargo tauri android build --debug --target aarch64

      - name: Run plugin JVM unit tests
        working-directory: examples/admob-demo/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-ad2mob:testDebugUnitTest

  # ---------------------------------------------------------------------------
  # iOS
  # ---------------------------------------------------------------------------
  ios:
    name: iOS · simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup private cargo dependency forks
        uses: ./.github/actions/setup-cargo-forks
        with:
          ssh_deploy_key_swift_rs: ${{ secrets.SSH_DEPLOY_KEY_SWIFT_RS }}
          ssh_deploy_key_tauri_utils: ${{ secrets.SSH_DEPLOY_KEY_TAURI_UTILS }}
          ssh_deploy_key_tauri_plugin: ${{ secrets.SSH_DEPLOY_KEY_TAURI_PLUGIN }}

      - name: Select Xcode 16
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "ERROR: No Xcode 16 installation found."
            echo "Installed Xcode versions:"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
            exit 1
          fi

          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          echo "Selected Xcode:"
          xcodebuild -version

          echo "Developer directory:"
          xcode-select -p

      - name: Install Rust iOS targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Initialize Tauri iOS project
        working-directory: examples/admob-demo/src-tauri
        run: |
          cargo tauri ios init

      - name: Inspect SwiftPM Google frameworks
        working-directory: examples/admob-demo/src-tauri
        run: |
          echo "===== Swift ====="
          swift --version

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== Plugin Package.swift ====="
          cat ../../../ios/Package.swift

          echo "===== Tauri generated API ====="
          ls -la .tauri/
          ls -la .tauri/tauri-api/

          echo "===== Resolve plugin Swift package ====="
          cd ../../../ios
          swift package resolve

          echo "===== SwiftPM dependencies ====="
          swift package show-dependencies

          echo "===== SwiftPM .build directories ====="
          find .build -type d | sort

          echo "===== GoogleMobileAds artifacts ====="
          find .build -type d \
            \( \
              -name "GoogleMobileAds.framework" \
              -o \
              -name "GoogleMobileAds.xcframework" \
            \) \
            -print || true

          echo "===== GoogleUserMessagingPlatform artifacts ====="
          find .build -type d \
            \( \
              -name "GoogleUserMessagingPlatform.framework" \
              -o \
              -name "GoogleUserMessagingPlatform.xcframework" \
            \) \
            -print || true

          echo "===== SwiftPM artifacts ====="
          find .build/artifacts -maxdepth 10 -print 2>/dev/null | sort || true

      - name: Build example app for the iOS simulator
        working-directory: examples/admob-demo/src-tauri
        run: |
          cargo tauri ios build --target aarch64-sim
