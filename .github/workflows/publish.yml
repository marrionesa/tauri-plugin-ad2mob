name: Publish

on:
  # Manual-only publishing: NOTHING is uploaded to crates.io or npmjs
  # automatically. Pushing a tag does NOT publish. To release, run this
  # workflow BY HAND from GitHub (Actions → Publish → Run workflow) and
  # select the release tag (vX.Y.Z) in the ref dropdown — the first step of
  # each job cross-checks that tag against the versions in Cargo.toml and
  # package.json and refuses to publish from a plain branch.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # crates.io — publishes the Rust crate for the pushed version tag.
  # Requires the CARGO_REGISTRY_TOKEN repository secret (crates.io API token).
  # ---------------------------------------------------------------------------
  crates:
    name: crates.io · cargo publish
    runs-on: ubuntu-latest
    env:
      # Cargo must use the system ssh (git CLI) so the per-repo SSH aliases
      # configured by setup-cargo-forks apply to the private fork dependencies.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup private cargo dependency forks
        uses: ./.github/actions/setup-cargo-forks
        with:
          ssh_deploy_key_swift_rs: ${{ secrets.SSH_DEPLOY_KEY_SWIFT_RS }}
          ssh_deploy_key_tauri_utils: ${{ secrets.SSH_DEPLOY_KEY_TAURI_UTILS }}
          ssh_deploy_key_tauri_plugin: ${{ secrets.SSH_DEPLOY_KEY_TAURI_PLUGIN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install system libraries (Tauri Linux prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Verify the ref matches the crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "$CRATE" ]; then
            echo "ERROR: selected ref '${GITHUB_REF_NAME}' does not match Cargo.toml version '${CRATE}'."
            echo "Run this workflow from the release tag (v${CRATE}), not from a branch."
            exit 1
          fi

      - name: Full verification before publishing
        run: bash scripts/verify.sh

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # npm — publishes the TypeScript guest package for the pushed version tag.
  # Requires the NPM_TOKEN repository secret (npm automation token).
  # ---------------------------------------------------------------------------
  npm:
    name: npm · npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the ref matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: selected ref '${GITHUB_REF_NAME}' does not match package.json version '${PKG}'."
            echo "Run this workflow from the release tag (v${PKG}), not from a branch."
            exit 1
          fi

      - name: Build (CJS + ESM)
        run: bun run build

      - name: Contract + publish-readiness checks
        run: |
          node scripts/check-contract.mjs
          node scripts/check-publish.mjs

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
