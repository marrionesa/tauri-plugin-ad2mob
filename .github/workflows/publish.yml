name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # crates.io — publishes the Rust crate for the pushed version tag.
  # Requires the CARGO_REGISTRY_TOKEN repository secret (crates.io API token).
  # ---------------------------------------------------------------------------
  crates:
    name: crates.io · cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install system libraries (Tauri Linux prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Verify the tag matches the crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "$CRATE" ]; then
            echo "tag v$TAG != Cargo.toml $CRATE"; exit 1
          fi

      - name: Full verification before publishing
        run: bash scripts/verify.sh

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # npm — publishes the TypeScript guest package for the pushed version tag.
  # Requires the NPM_TOKEN repository secret (npm automation token).
  # ---------------------------------------------------------------------------
  npm:
    name: npm · npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG"; exit 1
          fi

      - name: Build (CJS + ESM)
        run: bun run build

      - name: Contract + publish-readiness checks
        run: |
          node scripts/check-contract.mjs
          node scripts/check-publish.mjs

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
