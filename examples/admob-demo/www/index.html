<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>tauri-plugin-ad2mob demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --card: #ffffff;
        --text: #1c1917;
        --muted: #78716c;
        --border: #e7e5e4;
        --accent: #059669;
        --accent-soft: #ecfdf5;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --card: #1c1917;
          --text: #fafaf9;
          --muted: #a8a29e;
          --border: #292524;
          --accent: #34d399;
          --accent-soft: #064e3b;
          --danger: #f87171;
          --danger-soft: #450a0a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.45;
        /* Reserve space for the native banner shown at the bottom edge. */
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      main { max-width: 560px; margin: 0 auto; padding: 16px 16px 96px; }
      h1 { font-size: 18px; margin: 8px 0 2px; }
      .subtitle { color: var(--muted); margin: 0 0 14px; font-size: 12.5px; }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 8px;
        font-size: 13.5px;
        font-weight: 500;
        min-height: 44px;
        cursor: pointer;
        transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
      }
      button:hover { border-color: var(--accent); }
      button:active { transform: scale(0.985); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button.primary { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
      .status {
        display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted);
      }
      .badge {
        border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px;
        font-variant-numeric: tabular-nums;
      }
      #log {
        max-height: 300px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        background: var(--bg);
      }
      #log .entry { padding: 2px 0; border-bottom: 1px dashed var(--border); word-break: break-word; }
      #log .entry:last-child { border-bottom: none; }
      #log time { color: var(--muted); margin-right: 6px; }
      #log .event { color: var(--accent); font-weight: 600; }
      #log .error { color: var(--danger); font-weight: 600; }
      #log .payload { color: var(--muted); }
      #log::-webkit-scrollbar { width: 8px; }
      #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>tauri-plugin-ad2mob</h1>
      <p class="subtitle">
        Community demo · isTesting: true · uses Google's official test ads only
      </p>

      <section aria-label="Setup">
        <h2>Setup &amp; privacy</h2>
        <div class="grid">
          <button id="btn-initialize" class="primary">Initialize</button>
          <button id="btn-status">Get Status</button>
          <button id="btn-consent">Request Consent</button>
          <button id="btn-att">Request ATT</button>
        </div>
        <p class="status" style="margin-bottom:0; margin-top:10px" id="status-badges"></p>
      </section>

      <section aria-label="Banner">
        <h2>Native banner</h2>
        <div class="grid">
          <button id="btn-banner-show">Show Banner</button>
          <button id="btn-banner-hide">Hide Banner</button>
          <button id="btn-banner-top">Position: Top</button>
          <button id="btn-banner-bottom">Position: Bottom</button>
          <button id="btn-banner-visible">Is Visible?</button>
          <button id="btn-banner-destroy">Destroy Banner</button>
        </div>
      </section>

      <section aria-label="Interstitial">
        <h2>Interstitial</h2>
        <div class="grid">
          <button id="btn-interstitial-load">Load Interstitial</button>
          <button id="btn-interstitial-show">Show Interstitial</button>
        </div>
      </section>

      <section aria-label="Rewarded">
        <h2>Rewarded</h2>
        <div class="grid">
          <button id="btn-rewarded-load">Load Rewarded</button>
          <button id="btn-rewarded-show">Show Rewarded</button>
        </div>
      </section>

      <section aria-label="Event log">
        <h2>Event log</h2>
        <div id="log" role="log" aria-live="polite"></div>
      </section>

      <section aria-label="Cleanup">
        <h2>Cleanup</h2>
        <div class="grid">
          <button id="btn-destroy" style="grid-column: span 2; color: var(--danger)">Destroy everything</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
