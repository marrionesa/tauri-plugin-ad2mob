[package]
name = "admob-demo"
version = "0.1.0"
description = "Example app demonstrating every tauri-plugin-ad2mob feature"
edition = "2021"
publish = false

[lib]
name = "admob_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Default features include the wry runtime, like any real Tauri app.
tauri = { version = "2", features = [] }
tauri-plugin-ad2mob = { path = "../../.." }
serde_json = "1"
